<link rel="stylesheet" href="/static/style.css">

<h2>Predict Product Demand</h2>

<form action="/result" method="post" class="card">
    Product Name:<br>
    <input name="product" required><br><br>

    Price:<br>
    <input type="number" step="0.01" name="price" required><br><br>

    Previous Sales:<br>
    <input type="number" name="sales" required><br><br>

    Rating (1–5):<br>
    <input type="number" name="rating" min="1" max="5" step="0.1" required><br><br>

    Country:<br>
    <input name="country" required><br><br>

    <button type="submit">Predict</button>
</form>
